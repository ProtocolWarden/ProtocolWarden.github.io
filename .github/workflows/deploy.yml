name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and deploy
        run: mkdocs gh-deploy --force

      - name: Ensure Pages source is gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE=$(gh api repos/${{ github.repository }}/pages --jq '.source.branch' 2>/dev/null || echo "unknown")
          if [ "$SOURCE" != "gh-pages" ]; then
            echo "Pages source is '$SOURCE', correcting to gh-pages..."
            gh api --method PUT repos/${{ github.repository }}/pages --input - <<'EOF'
          {"source": "gh-pages"}
          EOF
          else
            echo "Pages source is already gh-pages — no action needed."
          fi
